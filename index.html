  <script>
    /* ==================================================
       SISTEMA DE CAPAS ESTABLE
       ================================================== */

    AFRAME.registerComponent("render-order", {
      schema: { type: "number", default: 0 },

      init: function () {
        this.aplicarOrden = this.aplicarOrden.bind(this);

        this.el.addEventListener(
          "object3dset",
          this.aplicarOrden
        );

        this.aplicarOrden();
      },

      update: function () {
        this.aplicarOrden();
      },

      aplicarOrden: function () {
        const order = this.data;

        this.el.object3D.traverse(function (obj) {
          obj.renderOrder = order;

          if (obj.material) {
            obj.material.depthTest = false;
            obj.material.depthWrite = false;
            obj.material.needsUpdate = true;
          }
        });
      }
    });
  </script>

      overflow: hidden;

<script>

document.addEventListener("DOMContentLoaded", () => {

  const target = document.querySelector("#target");

  const cielo = document.querySelector("#cielo");
  const pastoAtras = document.querySelector("#pastoAtras");
  const arbustos = document.querySelector("#arbustos");

  const cortinaIzquierda =
    document.querySelector("#cortinaIzquierda");

  const cortinaDerecha =
    document.querySelector("#cortinaDerecha");

  const titulo = document.querySelector("#titulo");
  const ramas = document.querySelector("#ramasFrente");

  const sillon = document.querySelector("#sillon");

  const carlitos = document.querySelector("#carlitos");
  const molly = document.querySelector("#molly");
  const noah = document.querySelector("#noah");
  const bimba = document.querySelector("#bimba");

  const florIzq1 = document.querySelector("#florIzq1");
  const florIzq2 = document.querySelector("#florIzq2");
  const florIzq3 = document.querySelector("#florIzq3");

  const florDer1 = document.querySelector("#florDer1");
  const florDer2 = document.querySelector("#florDer2");
  const florDer3 = document.querySelector("#florDer3");

  const debug = document.querySelector("#debug");


  /* ==================================================
     FRAMES DE LOS PERRITOS
     ================================================== */

  let carlitosFrame = 1;
  let mollyFrame = 1;
  let noahFrame = 1;
  let bimbaFrame = 1;

  let timerPerros = null;


  function cambiarFrame(perrito, prefijo, frame) {

    const numero =
      String(frame).padStart(2, "0");

    perrito.setAttribute(
      "material",
      "src",
      `#${prefijo}${numero}`
    );
  }


  function animarPerros() {

    cambiarFrame(
      carlitos,
      "c",
      carlitosFrame
    );

    cambiarFrame(
      molly,
      "m",
      mollyFrame
    );

    cambiarFrame(
      noah,
      "n",
      noahFrame
    );

    cambiarFrame(
      bimba,
      "b",
      bimbaFrame
    );


    carlitosFrame++;
    mollyFrame++;
    noahFrame++;
    bimbaFrame++;


    if (carlitosFrame > 16)
      carlitosFrame = 1;

    if (mollyFrame > 4)
      mollyFrame = 1;

    if (noahFrame > 4)
      noahFrame = 1;

    if (bimbaFrame > 4)
      bimbaFrame = 1;
  }



  /* ==================================================
     FUNCIONES DE ENTRADA
     ================================================== */

  function ocultarElemento(elemento) {

    elemento.setAttribute(
      "scale",
      "0.001 0.001 0.001"
    );
  }


  function mostrarElemento(
    elemento,
    duracion = 500
  ) {

    elemento.removeAttribute(
      "animation__entrada"
    );

    elemento.setAttribute(
      "animation__entrada",
      `
        property: scale;
        from: 0.001 0.001 0.001;
        to: 1 1 1;
        dur: ${duracion};
        easing: easeOutBack
      `
    );
  }



  /* ==================================================
     PREPARAR ESCENA ANTES DE ESCANEAR
     ================================================== */

  function prepararEscena() {

    ocultarElemento(cielo);
    ocultarElemento(pastoAtras);
    ocultarElemento(arbustos);

    ocultarElemento(cortinaIzquierda);
    ocultarElemento(cortinaDerecha);

    ocultarElemento(titulo);
    ocultarElemento(ramas);

    ocultarElemento(sillon);

    ocultarElemento(molly);
    ocultarElemento(bimba);

    ocultarElemento(carlitos);
    ocultarElemento(noah);

    ocultarElemento(florIzq1);
    ocultarElemento(florIzq2);
    ocultarElemento(florIzq3);

    ocultarElemento(florDer1);
    ocultarElemento(florDer2);
    ocultarElemento(florDer3);
  }


  prepararEscena();



  /* ==================================================
     TARGET ENCONTRADO
     ================================================== */

  target.addEventListener(
    "targetFound",
    () => {

      debug.innerHTML =
        "V47 · ECLOSIÓN COLORIDA ✨";


      /* ----------------------------------------------
         0 ms
         Aparece el mundo
         ---------------------------------------------- */

      mostrarElemento(
        cielo,
        600
      );

      mostrarElemento(
        pastoAtras,
        650
      );


      /* ----------------------------------------------
         200 ms
         Arbustos
         ---------------------------------------------- */

      setTimeout(() => {

        mostrarElemento(
          arbustos,
          650
        );

      }, 200);



      /* ----------------------------------------------
         400 ms
         Cortinas
         ---------------------------------------------- */

      setTimeout(() => {

        mostrarElemento(
          cortinaIzquierda,
          700
        );

        mostrarElemento(
          cortinaDerecha,
          700
        );

      }, 400);



      /* ----------------------------------------------
         650 ms
         Ramas
         ---------------------------------------------- */

      setTimeout(() => {

        mostrarElemento(
          ramas,
          750
        );

      }, 650);



      /* ----------------------------------------------
         800 ms
         Flores
         ---------------------------------------------- */

      setTimeout(() => {

        mostrarElemento(
          florIzq1,
          450
        );

        mostrarElemento(
          florDer1,
          450
        );

      }, 800);


      setTimeout(() => {

        mostrarElemento(
          florIzq2,
          450
        );

        mostrarElemento(
          florDer2,
          450
        );

      }, 950);


      setTimeout(() => {

        mostrarElemento(
          florIzq3,
          450
        );

        mostrarElemento(
          florDer3,
          450
        );

      }, 1100);



      /* ----------------------------------------------
         1200 ms
         Título
         ---------------------------------------------- */

      setTimeout(() => {

        mostrarElemento(
          titulo,
          800
        );

      }, 1200);



      /* ----------------------------------------------
         1450 ms
         Sillón
         ---------------------------------------------- */

      setTimeout(() => {

        mostrarElemento(
          sillon,
          700
        );

      }, 1450);



      /* ----------------------------------------------
         1700 ms
         Molly + Bimba
         ---------------------------------------------- */

      setTimeout(() => {

        mostrarElemento(
          molly,
          600
        );

        mostrarElemento(
          bimba,
          600
        );

      }, 1700);



      /* ----------------------------------------------
         2000 ms
         Carlitos + Noah
         ---------------------------------------------- */

      setTimeout(() => {

        mostrarElemento(
          carlitos,
          650
        );

        mostrarElemento(
          noah,
          650
        );

      }, 2000);



      /* ----------------------------------------------
         2250 ms
         Comienza la vida
         ---------------------------------------------- */

      setTimeout(() => {

        carlitosFrame = 1;
        mollyFrame = 1;
        noahFrame = 1;
        bimbaFrame = 1;

        animarPerros();

        if (timerPerros) {
          clearInterval(
            timerPerros
          );
        }

        timerPerros =
          setInterval(
            animarPerros,
            500
          );

      }, 2250);



      /* ==================================================
         MOVIMIENTO AMBIENTAL
         ================================================== */


      /* RAMAS — VIENTO SUAVE */

      ramas.setAttribute(
        "animation__viento",
        `
          property: rotation;
          from: 0 0 -1;
          to: 0 0 1;
          dur: 2600;
          dir: alternate;
          loop: true;
          easing: easeInOutSine
        `
      );


      /* FLORES — MOVIMIENTO DIFERENTE */

      florIzq1.setAttribute(
        "animation__flor",
        `
          property: rotation;
          from: 0 0 -12;
          to: 0 0 -7;
          dur: 1800;
          dir: alternate;
          loop: true;
          easing: easeInOutSine
        `
      );


      florIzq2.setAttribute(
        "animation__flor",
        `
          property: rotation;
          from: 0 0 8;
          to: 0 0 13;
          dur: 2200;
          dir: alternate;
          loop: true;
          easing: easeInOutSine
        `
      );


      florIzq3.setAttribute(
        "animation__flor",
        `
          property: rotation;
          from: 0 0 14;
          to: 0 0 9;
          dur: 2000;
          dir: alternate;
          loop: true;
          easing: easeInOutSine
        `
      );


      florDer1.setAttribute(
        "animation__flor",
        `
          property: rotation;
          from: 0 0 12;
          to: 0 0 7;
          dur: 1900;
          dir: alternate;
          loop: true;
          easing: easeInOutSine
        `
      );


      florDer2.setAttribute(
        "animation__flor",
        `
          property: rotation;
          from: 0 0 -8;
          to: 0 0 -13;
          dur: 2300;
          dir: alternate;
          loop: true;
          easing: easeInOutSine
        `
      );


      florDer3.setAttribute(
        "animation__flor",
        `
          property: rotation;
          from: 0 0 -14;
          to: 0 0 -9;
          dur: 2100;
          dir: alternate;
          loop: true;
          easing: easeInOutSine
        `
      );



      /* ==================================================
         MOVIMIENTO MUY SUAVE DE CARLITOS Y NOAH

         IMPORTANTE:
         NO tocamos position.
         Usamos scale para no perder las coordenadas finales.
         ================================================== */

      carlitos.setAttribute(
        "animation__vida",
        `
          property: scale;
          from: 1 1 1;
          to: 1.025 1.025 1.025;
          dur: 1500;
          dir: alternate;
          loop: true;
          easing: easeInOutSine;
          delay: 2800
        `
      );


      noah.setAttribute(
        "animation__vida",
        `
          property: scale;
          from: 1 1 1;
          to: 1.02 1.02 1.02;
          dur: 1700;
          dir: alternate;
          loop: true;
          easing: easeInOutSine;
          delay: 3000
        `
      );

    }
  );



  /* ==================================================
     TARGET PERDIDO
     ================================================== */

  target.addEventListener(
    "targetLost",
    () => {

      debug.innerHTML =
        "V47 · TARGET PERDIDO";


      if (timerPerros) {

        clearInterval(
          timerPerros
        );

        timerPerros = null;
      }


      ramas.removeAttribute(
        "animation__viento"
      );


      florIzq1.removeAttribute(
        "animation__flor"
      );

      florIzq2.removeAttribute(
        "animation__flor"
      );

      florIzq3.removeAttribute(
        "animation__flor"
      );

      florDer1.removeAttribute(
        "animation__flor"
      );

      florDer2.removeAttribute(
        "animation__flor"
      );

      florDer3.removeAttribute(
        "animation__flor"
      );


      carlitos.removeAttribute(
        "animation__vida"
      );

      noah.removeAttribute(
        "animation__vida"
      );


      prepararEscena();

    }
  );

});

</script>
