<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Eclosión Colorida AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <img id="f01" src="./dream8/Dream%208_000001.png">
    <img id="f02" src="./dream8/Dream%208_000002.png">
    <img id="f03" src="./dream8/Dream%208_000003.png">
    <img id="f04" src="./dream8/Dream%208_000004.png">
    <img id="f05" src="./dream8/Dream%208_000005.png">
    <img id="f06" src="./dream8/Dream%208_000006.png">
    <img id="f07" src="./dream8/Dream%208_000007.png">
    <img id="f08" src="./dream8/Dream%208_000008.png">
    <img id="f09" src="./dream8/Dream%208_000009.png">
    <img id="f10" src="./dream8/Dream%208_000010.png">
    <img id="f11" src="./dream8/Dream%208_000011.png">
    <img id="f12" src="./dream8/Dream%208_000012.png">
    <img id="f13" src="./dream8/Dream%208_000013.png">
    <img id="f14" src="./dream8/Dream%208_000014.png">
    <img id="f15" src="./dream8/Dream%208_000015.png">
    <img id="f16" src="./dream8/Dream%208_000016.png">
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">

    <a-plane class="dogFrame" src="#f01"
      position="0 0 0.01" width="1" height="1"
      material="shader: flat; transparent: true; alphaTest: 0.01; depthWrite: false">
    </a-plane>

    <a-plane class="dogFrame" src="#f02"
      position="0 0 0.011" width="1" height="1"
      visible="false"
      material="shader: flat; transparent: true; alphaTest: 0.01; depthWrite: false">
    </a-plane>

    <a-plane class="dogFrame" src="#f03"
      position="0 0 0.012" width="1" height="1"
      visible="false"
      material="shader: flat; transparent: true; alphaTest: 0.01; depthWrite: false">
    </a-plane>

    <a-plane class="dogFrame" src="#f04"
      position="0 0 0.013" width="1" height="1"
      visible="false"
      material="shader: flat; transparent: true; alphaTest: 0.01; depthWrite: false">
    </a-plane>

    <a-plane class="dogFrame" src="#f05"
      position="0 0 0.014" width="1" height="1"
      visible="false"
      material="shader: flat; transparent: true; alphaTest: 0.01; depthWrite: false">
    </a-plane>

    <a-plane class="dogFrame" src="#f06"
      position="0 0 0.015" width="1" height="1"
      visible="false"
      material="shader: flat; transparent: true; alphaTest: 0.01; depthWrite: false">
    </a-plane>

    <a-plane class="dogFrame" src="#f07"
      position="0 0 0.016" width="1" height="1"
      visible="false"
      material="shader: flat; transparent: true; alphaTest: 0.01; depthWrite: false">
    </a-plane>

    <a-plane class="dogFrame" src="#f08"
      position="0 0 0.017" width="1" height="1"
      visible="false"
      material="shader: flat; transparent: true; alphaTest: 0.01; depthWrite: false">
    </a-plane>

    <a-plane class="dogFrame" src="#f09"
      position="0 0 0.018" width="1" height="1"
      visible="false"
      material="shader: flat; transparent: true; alphaTest: 0.01; depthWrite: false">
    </a-plane>

    <a-plane class="dogFrame" src="#f10"
      position="0 0 0.019" width="1" height="1"
      visible="false"
      material="shader: flat; transparent: true; alphaTest: 0.01; depthWrite: false">
    </a-plane>

    <a-plane class="dogFrame" src="#f11"
      position="0 0 0.020" width="1" height="1"
      visible="false"
      material="shader: flat; transparent: true; alphaTest: 0.01; depthWrite: false">
    </a-plane>

    <a-plane class="dogFrame" src="#f12"
      position="0 0 0.021" width="1" height="1"
      visible="false"
      material="shader: flat; transparent: true; alphaTest: 0.01; depthWrite: false">
    </a-plane>

    <a-plane class="dogFrame" src="#f13"
      position="0 0 0.022" width="1" height="1"
      visible="false"
      material="shader: flat; transparent: true; alphaTest: 0.01; depthWrite: false">
    </a-plane>

    <a-plane class="dogFrame" src="#f14"
      position="0 0 0.023" width="1" height="1"
      visible="false"
      material="shader: flat; transparent: true; alphaTest: 0.01; depthWrite: false">
    </a-plane>

    <a-plane class="dogFrame" src="#f15"
      position="0 0 0.024" width="1" height="1"
      visible="false"
      material="shader: flat; transparent: true; alphaTest: 0.01; depthWrite: false">
    </a-plane>

    <a-plane class="dogFrame" src="#f16"
      position="0 0 0.025" width="1" height="1"
      visible="false"
      material="shader: flat; transparent: true; alphaTest: 0.01; depthWrite: false">
    </a-plane>

  </a-entity>

</a-scene>

<script>
  const target = document.querySelector("#target");
  const frames = document.querySelectorAll(".dogFrame");

  let current = 0;
  let timer = null;

  function showFrame(index) {
    frames.forEach((frame, i) => {
      frame.setAttribute("visible", i === index);
    });
  }

  function startAnimation() {
    if (timer) return;

    current = 0;
    showFrame(current);

    timer = setInterval(() => {
      current = (current + 1) % frames.length;
      showFrame(current);
    }, 500);
  }

  function stopAnimation() {
    if (timer) {
      clearInterval(timer);
      timer = null;
    }

    current = 0;
    showFrame(0);
  }

  target.addEventListener("targetFound", startAnimation);
  target.addEventListener("targetLost", stopAnimation);
</script>

</body>
</html>
