<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Prueba Eclosión AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #debug {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;

      background: rgba(0,0,0,.75);
      color: white;

      padding: 10px 16px;
      border-radius: 12px;

      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;

      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="debug">
  ESPERANDO TARGET...
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>

    <img id="f01" src="./dream8/Dream%208_000001.png">
    <img id="f02" src="./dream8/Dream%208_000002.png">
    <img id="f03" src="./dream8/Dream%208_000003.png">
    <img id="f04" src="./dream8/Dream%208_000004.png">
    <img id="f05" src="./dream8/Dream%208_000005.png">
    <img id="f06" src="./dream8/Dream%208_000006.png">
    <img id="f07" src="./dream8/Dream%208_000007.png">
    <img id="f08" src="./dream8/Dream%208_000008.png">
    <img id="f09" src="./dream8/Dream%208_000009.png">
    <img id="f10" src="./dream8/Dream%208_000010.png">
    <img id="f11" src="./dream8/Dream%208_000011.png">
    <img id="f12" src="./dream8/Dream%208_000012.png">
    <img id="f13" src="./dream8/Dream%208_000013.png">
    <img id="f14" src="./dream8/Dream%208_000014.png">
    <img id="f15" src="./dream8/Dream%208_000015.png">
    <img id="f16" src="./dream8/Dream%208_000016.png">

  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">

    <a-plane
      id="dog"
      position="0 0 0.01"
      width="1"
      height="1"
      material="
        src: #f01;
        shader: flat;
        transparent: true;
        alphaTest: 0.01;
        depthWrite: false;">
    </a-plane>

  </a-entity>

</a-scene>

<script>

document.addEventListener("DOMContentLoaded", () => {

  const target = document.querySelector("#target");
  const dog = document.querySelector("#dog");
  const debug = document.querySelector("#debug");

  let frame = 1;
  let timer = null;

  function showFrame() {

    const number = String(frame).padStart(2, "0");

    dog.setAttribute(
      "material",
      "src",
      `#f${number}`
    );

    debug.innerHTML =
      `ANIMACIÓN ACTIVA<br>FRAME ${frame}`;

    frame++;

    if (frame > 16) {
      frame = 1;
    }
  }


  target.addEventListener("targetFound", () => {

    debug.innerHTML =
      "TARGET ENCONTRADO<br>INICIANDO...";

    if (timer) {
      clearInterval(timer);
    }

    frame = 1;

    showFrame();

    timer = setInterval(() => {
      showFrame();
    }, 500);

  });


  target.addEventListener("targetLost", () => {

    debug.innerHTML =
      "TARGET PERDIDO";

    if (timer) {
      clearInterval(timer);
      timer = null;
    }

  });

});

</script>

</body>
</html>
