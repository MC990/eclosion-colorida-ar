<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>Eclosión Colorida AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>

    <img id="frame1"  src="./dream8/Dream%208_000001.png">
    <img id="frame2"  src="./dream8/Dream%208_000002.png">
    <img id="frame3"  src="./dream8/Dream%208_000003.png">
    <img id="frame4"  src="./dream8/Dream%208_000004.png">
    <img id="frame5"  src="./dream8/Dream%208_000005.png">
    <img id="frame6"  src="./dream8/Dream%208_000006.png">
    <img id="frame7"  src="./dream8/Dream%208_000007.png">
    <img id="frame8"  src="./dream8/Dream%208_000008.png">
    <img id="frame9"  src="./dream8/Dream%208_000009.png">
    <img id="frame10" src="./dream8/Dream%208_000010.png">
    <img id="frame11" src="./dream8/Dream%208_000011.png">
    <img id="frame12" src="./dream8/Dream%208_000012.png">
    <img id="frame13" src="./dream8/Dream%208_000013.png">
    <img id="frame14" src="./dream8/Dream%208_000014.png">
    <img id="frame15" src="./dream8/Dream%208_000015.png">
    <img id="frame16" src="./dream8/Dream%208_000016.png">

  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">

    <a-plane
      id="dog"
      position="0 0 0.01"
      width="1"
      height="1"
      material="
        src: #frame1;
        shader: flat;
        transparent: true;
        alphaTest: 0.01;
        depthWrite: false;
        side: double;">
    </a-plane>

  </a-entity>

</a-scene>

<script>

  const FPS = 2;
  const FRAME_COUNT = 16;

  const target = document.querySelector("#target");
  const dog = document.querySelector("#dog");

  const textures = [];

  let currentFrame = 0;
  let timer = null;

  // Crear las 16 texturas una sola vez
  window.addEventListener("load", () => {

    const loader = new THREE.TextureLoader();

    for (let i = 1; i <= FRAME_COUNT; i++) {

      const number = String(i).padStart(6, "0");

      const texture = loader.load(
        `./dream8/Dream%208_${number}.png`
      );

      texture.colorSpace = THREE.SRGBColorSpace;
      texture.flipY = true;

      textures.push(texture);
    }

  });


  function showFrame(index) {

    const mesh = dog.getObject3D("mesh");

    if (!mesh || !mesh.material || !textures[index]) {
      return;
    }

    mesh.material.map = textures[index];

    mesh.material.transparent = true;
    mesh.material.alphaTest = 0.01;
    mesh.material.depthWrite = false;

    mesh.material.needsUpdate = true;
  }


  function startAnimation() {

    if (timer) return;

    currentFrame = 0;

    showFrame(currentFrame);

    timer = setInterval(() => {

      currentFrame =
        (currentFrame + 1) % FRAME_COUNT;

      showFrame(currentFrame);

    }, 1000 / FPS);

  }


  function stopAnimation() {

    if (timer) {

      clearInterval(timer);

      timer = null;
    }

    currentFrame = 0;

    showFrame(0);
  }


  target.addEventListener(
    "targetFound",
    startAnimation
  );


  target.addEventListener(
    "targetLost",
    stopAnimation
  );

</script>

</body>
</html>
