  <script>

    AFRAME.registerComponent("crop-sillon", {

      init: function () {

        this.aplicado = false;

      },


      tick: function () {

        if (this.aplicado) return;


        const mesh = this.el.getObject3D("mesh");

        if (!mesh) return;


        const material = mesh.material;

        if (!material || !material.map) return;


        const texture = material.map;


        /*
          PNG ORIGINAL:
          1640 x 2360

          ÁREA REAL DEL SILLÓN:
          x = 115 → 1497
          y = 1000 → 1534

          El código de abajo hace que A-Frame
          utilice solamente esa región.
        */


        texture.wrapS = THREE.ClampToEdgeWrapping;
        texture.wrapT = THREE.ClampToEdgeWrapping;


        texture.repeat.set(

          1382 / 1640,

          534 / 2360

        );


        texture.offset.set(

          115 / 1640,

          826 / 2360

        );


        texture.needsUpdate = true;


        this.aplicado = true;

      }

    });

  </script>

<script>


document.addEventListener("DOMContentLoaded", () => {


  const target = document.querySelector("#target");


  const carlitos = document.querySelector("#carlitos");

  const molly = document.querySelector("#molly");

  const noah = document.querySelector("#noah");

  const bimba = document.querySelector("#bimba");


  const debug = document.querySelector("#debug");



  let carlitosFrame = 1;

  let mollyFrame = 1;

  let noahFrame = 1;

  let bimbaFrame = 1;


  let timer = null;



  function cambiarFrame(perrito, prefijo, frame) {


    const numero = String(frame).padStart(2, "0");


    perrito.setAttribute(

      "material",

      "src",

      `#${prefijo}${numero}`

    );

  }



  function animar() {


    cambiarFrame(
      carlitos,
      "c",
      carlitosFrame
    );


    cambiarFrame(
      molly,
      "m",
      mollyFrame
    );


    cambiarFrame(
      noah,
      "n",
      noahFrame
    );


    cambiarFrame(
      bimba,
      "b",
      bimbaFrame
    );



    carlitosFrame++;

    mollyFrame++;

    noahFrame++;

    bimbaFrame++;



    if (carlitosFrame > 16) {

      carlitosFrame = 1;

    }


    if (mollyFrame > 4) {

      mollyFrame = 1;

    }


    if (noahFrame > 4) {

      noahFrame = 1;

    }


    if (bimbaFrame > 4) {

      bimbaFrame = 1;

    }



    debug.innerHTML =

      `🐶 CARLITOS ${carlitosFrame}/16 · MOLLY ${mollyFrame}/4<br>
       NOAH ${noahFrame}/4 · BIMBA ${bimbaFrame}/4`;

  }



  target.addEventListener(

    "targetFound",

    () => {


      debug.innerHTML =

        "TARGET ENCONTRADO 🐶🐶🐶🐶";



      if (timer) {

        clearInterval(timer);

      }



      carlitosFrame = 1;

      mollyFrame = 1;

      noahFrame = 1;

      bimbaFrame = 1;



      animar();



      timer = setInterval(

        () => {

          animar();

        },

        500

      );

    }

  );



  target.addEventListener(

    "targetLost",

    () => {


      debug.innerHTML =

        "TARGET PERDIDO";



      if (timer) {

        clearInterval(timer);

        timer = null;

      }

    }

  );


});


</script>
