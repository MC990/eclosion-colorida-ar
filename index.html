<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Eclosión Colorida AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <img id="dogFrame" crossorigin="anonymous">
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">

    <a-plane
      id="dog"
      position="0 0 0.01"
      width="1"
      height="1"
      material="
        shader: flat;
        transparent: true;
        alphaTest: 0.01;
        depthWrite: false;
        side: double;">
    </a-plane>

  </a-entity>

</a-scene>

<script>
  const FRAME_COUNT = 16;
  const FPS = 2;

  const target = document.querySelector("#target");
  const dog = document.querySelector("#dog");
  const image = document.querySelector("#dogFrame");

  let currentFrame = 1;
  let timer = null;

  function frameURL(frame) {
    const number = String(frame).padStart(6, "0");

    return `./dream8/Dream%208_${number}.png`;
  }

  function showFrame(frame) {

    image.onload = () => {

      dog.setAttribute("material", {
        src: image,
        shader: "flat",
        transparent: true,
        alphaTest: 0.01,
        depthWrite: false,
        side: "double"
      });

      const mesh = dog.getObject3D("mesh");

      if (mesh && mesh.material) {
        mesh.material.transparent = true;
        mesh.material.alphaTest = 0.01;
        mesh.material.depthWrite = false;
        mesh.material.needsUpdate = true;
      }
    };

    image.src = frameURL(frame);
  }

  function startAnimation() {

    if (timer) return;

    currentFrame = 1;
    showFrame(currentFrame);

    timer = setInterval(() => {

      currentFrame++;

      if (currentFrame > FRAME_COUNT) {
        currentFrame = 1;
      }

      showFrame(currentFrame);

    }, 1000 / FPS);
  }

  function stopAnimation() {

    if (timer) {
      clearInterval(timer);
      timer = null;
    }

    currentFrame = 1;
    showFrame(1);
  }

  target.addEventListener("targetFound", startAnimation);
  target.addEventListener("targetLost", stopAnimation);

  window.addEventListener("load", () => {
    showFrame(1);
  });

</script>

</body>
</html>
