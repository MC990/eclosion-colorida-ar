<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>Eclosión Colorida AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #debug {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;

      background: rgba(0,0,0,.72);
      color: white;

      padding: 8px 14px;
      border-radius: 10px;

      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: bold;
      text-align: center;

      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="debug">ESPERANDO TARGET...</div>


<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

  <a-assets>

    <!-- ============================================ -->
    <!-- ESCENA -->
    <!-- ============================================ -->

    <img id="cieloAsset"
         src="./escena/Cielo.PNG">

    <img id="pastoAtrasAsset"

    <img id="pastoJardinAsset"
         src="./escena/Pasto%20jard%C3%ADn.PNG">

    <img id="arbustosAsset"
         src="./escena/Arbustos.PNG">

    <img id="sillonAsset"
         src="./escena/Sillon-recortado.png">

    <img id="cortinaIzquierdaAsset"
         src="./escena/cortina%20izquierda.png">

    <img id="cortinaDerechaAsset"
         src="./escena/cortina%20derecha.png">

    <img id="tituloAsset"
         src="./escena/Eclosi%C3%B3n%20Colorida.PNG">

    <img id="ramasAsset"
         src="./escena/Ramas%20frente.PNG">

    <img id="florAzulAsset"
         src="./escena/Flor%20azul.PNG">

    <img id="florLilaAsset"
         src="./escena/Flor%20lila.PNG">

    <img id="florRosaClaroAsset"
         src="./escena/Flor%20rosa%20claro.PNG">

    <img id="florRosaOscuroAsset"
         src="./escena/Flor%20rosa%20obscuro.PNG">


    <!-- ============================================ -->
    <!-- CARLITOS -->
    <!-- ============================================ -->

    <img id="c01" src="./dream8/Dream%208_000001.png">
    <img id="c02" src="./dream8/Dream%208_000002.png">
    <img id="c03" src="./dream8/Dream%208_000003.png">
    <img id="c04" src="./dream8/Dream%208_000004.png">
    <img id="c05" src="./dream8/Dream%208_000005.png">
    <img id="c06" src="./dream8/Dream%208_000006.png">
    <img id="c07" src="./dream8/Dream%208_000007.png">
    <img id="c08" src="./dream8/Dream%208_000008.png">
    <img id="c09" src="./dream8/Dream%208_000009.png">
    <img id="c10" src="./dream8/Dream%208_000010.png">
    <img id="c11" src="./dream8/Dream%208_000011.png">
    <img id="c12" src="./dream8/Dream%208_000012.png">
    <img id="c13" src="./dream8/Dream%208_000013.png">
    <img id="c14" src="./dream8/Dream%208_000014.png">
    <img id="c15" src="./dream8/Dream%208_000015.png">
    <img id="c16" src="./dream8/Dream%208_000016.png">


    <!-- ============================================ -->
    <!-- MOLLY -->
    <!-- ============================================ -->

    <img id="m01" src="./molly/Dream%2010_000001.png">
    <img id="m02" src="./molly/Dream%2010_000002.png">
    <img id="m03" src="./molly/Dream%2010_000003.png">
    <img id="m04" src="./molly/Dream%2010_000004.png">


    <!-- ============================================ -->
    <!-- NOAH -->
    <!-- ============================================ -->

    <img id="n01" src="./noah/Dream%2011_000001.png">
    <img id="n02" src="./noah/Dream%2011_000002.png">
    <img id="n03" src="./noah/Dream%2011_000003.png">
    <img id="n04" src="./noah/Dream%2011_000004.png">


    <!-- ============================================ -->
    <!-- BIMBA -->
    <!-- ============================================ -->

    <img id="b01" src="./bimba/Dream%209_000001%20(1).png">
    <img id="b02" src="./bimba/Dream%209_000002%20(1).png">
    <img id="b03" src="./bimba/Dream%209_000003%20(1).png">
    <img id="b04" src="./bimba/Dream%209_000004%20(1).png">

  </a-assets>


  <a-camera
    position="0 0 0"
    look-controls="enabled: false"
  ></a-camera>


  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0"
  >


    <!-- ============================================ -->
    <!-- 1. CIELO -->
    <!-- ============================================ -->

    <a-plane
      id="cielo"
      position="0 0.08 0.001"
      width="0.98"
      height="1.46"
      material="
        src:#cieloAsset;
        shader:flat;
        transparent:false;
        depthWrite:true;
      "
    ></a-plane>


    <!-- ============================================ -->
    <!-- 2. PASTO MEDIO -->
    <!-- ============================================ -->

    <a-plane
      id="pastoAtras"
      position="0 -0.385 0.008"
      width="0.98"
      height="0.60"
      material="
        src:#pastoAtrasAsset;
        shader:flat;
        transparent:false;
        depthWrite:true;
      "
    ></a-plane>


    <!-- ============================================ -->
    <!-- 3. CORTINAS -->
    <!--
      V38:
      MISMO CENTRO APROBADO,
      PERO MÁS ANCHAS.
    -->
    <!-- ============================================ -->

    <a-plane
      id="cortinaIzquierda"
      position="-0.300 0.105 0.014"
      width="0.430"
      height="1.16"
      material="
        src:#cortinaIzquierdaAsset;
        shader:flat;
        transparent:true;
        alphaTest:.01;
        depthTest:false;
        depthWrite:false;
      "
    ></a-plane>


    <a-plane
      id="cortinaDerecha"
      position="0.300 0.105 0.014"
      width="0.430"
      height="1.16"
      material="
        src:#cortinaDerechaAsset;
        shader:flat;
        transparent:true;
        alphaTest:.01;
        depthTest:false;
        depthWrite:false;
      "
    ></a-plane>


    <!-- ============================================ -->
    <!-- 4. ARBUSTOS -->
    <!-- ============================================ -->

    <a-plane
      id="arbustos"
      position="0 0.010 0.025"
      width="0.98"
      height="0.355"
      material="
        src:#arbustosAsset;
        shader:flat;
        transparent:true;
        alphaTest:.01;
        depthTest:false;
        depthWrite:false;
      "
    ></a-plane>


    <!-- ============================================ -->
    <!-- 5. TÍTULO -->
    <!-- BLOQUEADO -->
    <!-- ============================================ -->

    <a-plane
      id="titulo"
      position="0 0.31 0.030"
      width="0.53"
      height="0.265"
      material="
        src:#tituloAsset;
        shader:flat;
        transparent:true;
        alphaTest:.01;
        depthTest:false;
        depthWrite:false;
      "
    ></a-plane>


    <!-- ============================================ -->
    <!-- 6. RAMAS -->
    <!--
      V38:
      SUBEN Y SE ACORTAN VERTICALMENTE.

      OBJETIVO:
      QUE EL FINAL INFERIOR QUEDE DETRÁS
      DEL SILLÓN Y NO CONTINÚE HASTA LOS PERROS.
    -->
    <!-- ============================================ -->

    <a-plane
      id="ramasFrente"
      position="0 0.175 0.045"
      width="1.30"
      height="0.94"
      material="
        src:#ramasAsset;
        shader:flat;
        transparent:true;
        alphaTest:.01;
        depthTest:false;
        depthWrite:false;
      "
    ></a-plane>


    <!-- ============================================ -->
    <!-- 7. FLORES DEL MARCO -->
    <!-- ============================================ -->

    <a-plane
      position="-0.430 0.330 0.050"
      width="0.072"
      height="0.072"
      rotation="0 0 -12"
      material="
        src:#florRosaClaroAsset;
        shader:flat;
        transparent:true;
        alphaTest:.01;
        depthTest:false;
        depthWrite:false;
      "
    ></a-plane>


    <a-plane
      position="-0.445 0.205 0.050"
      width="0.052"
      height="0.052"
      rotation="0 0 8"
      material="
        src:#florRosaOscuroAsset;
        shader:flat;
        transparent:true;
        alphaTest:.01;
        depthTest:false;
        depthWrite:false;
      "
    ></a-plane>


    <a-plane
      position="-0.435 0.090 0.050"
      width="0.076"
      height="0.076"
      rotation="0 0 14"
      material="
        src:#florLilaAsset;
        shader:flat;
        transparent:true;
        alphaTest:.01;
        depthTest:false;
        depthWrite:false;
      "
    ></a-plane>


    <a-plane
      position="-0.450 -0.010 0.050"
      width="0.045"
      height="0.045"
      rotation="0 0 -8"
      material="
        src:#florAzulAsset;
        shader:flat;
        transparent:true;
        alphaTest:.01;
        depthTest:false;
        depthWrite:false;
      "
    ></a-plane>


    <a-plane
      position="0.430 0.320 0.050"
      width="0.072"
      height="0.072"
      rotation="0 0 12"
      material="
        src:#florRosaClaroAsset;
        shader:flat;
        transparent:true;
        alphaTest:.01;
        depthTest:false;
        depthWrite:false;
      "
    ></a-plane>


    <a-plane
      position="0.445 0.190 0.050"
      width="0.052"
      height="0.052"
      rotation="0 0 -8"
      material="
        src:#florRosaOscuroAsset;
        shader:flat;
        transparent:true;
        alphaTest:.01;
        depthTest:false;
        depthWrite:false;
      "
    ></a-plane>


    <a-plane
      position="0.435 0.075 0.050"
      width="0.076"
      height="0.076"
      rotation="0 0 -14"
      material="
        src:#florLilaAsset;
        shader:flat;
        transparent:true;
        alphaTest:.01;
        depthTest:false;
        depthWrite:false;
      "
    ></a-plane>


    <a-plane
      position="0.450 -0.010 0.050"
      width="0.045"
      height="0.045"
      rotation="0 0 8"
      material="
        src:#florAzulAsset;
        shader:flat;
        transparent:true;
        alphaTest:.01;
        depthTest:false;
        depthWrite:false;
      "
    ></a-plane>


    <!-- ============================================ -->
    <!-- 8. SILLÓN -->
    <!--
      V38:
      MISMO TAMAÑO.
      BAJA DE -0.145 A -0.190.
    -->
    <!-- ============================================ -->

    <a-plane
      id="sillon"
      position="0 -0.190 0.115"
      width="0.94"
      height="0.373"
      material="
        src:#sillonAsset;
        shader:flat;
        transparent:true;
        alphaTest:.01;
        depthTest:false;
        depthWrite:false;
      "
    ></a-plane>


    <!-- ============================================ -->
    <!-- 9. MOLLY -->
    <!--
      X Y TAMAÑO BLOQUEADOS.
    -->
    <!-- ============================================ -->

    <a-plane
      id="molly"
      position="-0.17 -0.10 0.135"
      width="0.32"
      height="0.32"
      material="
        src:#m01;
        shader:flat;
        transparent:true;
        alphaTest:.01;
        depthTest:false;
        depthWrite:false;
      "
    ></a-plane>


    <!-- ============================================ -->
    <!-- 10. BIMBA -->
    <!-- ============================================ -->

    <a-plane
      id="bimba"
      position="0.16 -0.10 0.135"
      width="0.34"
      height="0.34"
      material="
        src:#b01;
        shader:flat;
        transparent:true;
        alphaTest:.01;
        depthTest:false;
        depthWrite:false;
      "
    ></a-plane>


    <!-- ============================================ -->
    <!-- 11. JARDÍN FRONTAL -->
    <!-- ============================================ -->

    <a-plane
      id="pastoJardin"
      position="0 -0.535 0.140"
      width="1.08"
      height="0.43"
      rotation="-7 0 0"
      material="
        src:#pastoJardinAsset;
        shader:flat;
        transparent:true;
        alphaTest:.01;
        depthTest:false;
        depthWrite:false;
      "
    ></a-plane>


    <!-- ============================================ -->
    <!-- 12. CARLITOS -->
    <!-- BLOQUEADO -->
    <!-- ============================================ -->

    <a-plane
      id="carlitos"
      position="-0.29 -0.34 0.170"
      width="0.35"
      height="0.35"
      material="
        src:#c01;
        shader:flat;
        transparent:true;
        alphaTest:.01;
        depthTest:false;
        depthWrite:false;
      "
    ></a-plane>


    <!-- ============================================ -->
    <!-- 13. NOAH -->
    <!-- BLOQUEADO -->
    <!-- ============================================ -->

    <a-plane
      id="noah"
      position="0.29 -0.34 0.170"
      width="0.34"
      height="0.34"
      material="
        src:#n01;
        shader:flat;
        transparent:true;
        alphaTest:.01;
        depthTest:false;
        depthWrite:false;
      "
    ></a-plane>


  </a-entity>

</a-scene>


<script>

document.addEventListener("DOMContentLoaded", () => {

  const target = document.querySelector("#target");

  const carlitos = document.querySelector("#carlitos");
  const molly = document.querySelector("#molly");
  const noah = document.querySelector("#noah");
  const bimba = document.querySelector("#bimba");

  const debug = document.querySelector("#debug");


  let carlitosFrame = 1;
  let mollyFrame = 1;
  let noahFrame = 1;
  let bimbaFrame = 1;

  let timer = null;


  function cambiarFrame(perrito, prefijo, frame) {

    const numero = String(frame).padStart(2, "0");

    perrito.setAttribute(
      "material",
      "src",
      `#${prefijo}${numero}`
    );

  }


  function animar() {

    cambiarFrame(carlitos, "c", carlitosFrame);
    cambiarFrame(molly, "m", mollyFrame);
    cambiarFrame(noah, "n", noahFrame);
    cambiarFrame(bimba, "b", bimbaFrame);


    carlitosFrame++;
    mollyFrame++;
    noahFrame++;
    bimbaFrame++;


    if (carlitosFrame > 16) {
      carlitosFrame = 1;
    }

    if (mollyFrame > 4) {
      mollyFrame = 1;
    }

    if (noahFrame > 4) {
      noahFrame = 1;
    }

    if (bimbaFrame > 4) {
      bimbaFrame = 1;
    }


    debug.innerHTML =
      `🐶 CARLITOS ${carlitosFrame}/16 · MOLLY ${mollyFrame}/4<br>
       NOAH ${noahFrame}/4 · BIMBA ${bimbaFrame}/4`;

  }


  target.addEventListener("targetFound", () => {

    debug.innerHTML =
      "TARGET ENCONTRADO 🐶🐶🐶🐶";


    if (timer) {
      clearInterval(timer);
    }


    carlitosFrame = 1;
    mollyFrame = 1;
    noahFrame = 1;
    bimbaFrame = 1;


    animar();


    timer = setInterval(() => {

      animar();

    }, 500);

  });


  target.addEventListener("targetLost", () => {

    debug.innerHTML =
      "TARGET PERDIDO";


    if (timer) {

      clearInterval(timer);
      timer = null;

    }

  });

});

</script>

</body>
</html>
